name: Build KG Sweet Engine VST3 Windows

on:
  push:
    branches: [ "kg-sweet-engine-v0.1" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S sweet-engine -B sweet-engine/build -G "Visual Studio 18 2026" -A x64

      - name: Build VST3
        shell: pwsh
        run: cmake --build sweet-engine/build --config Release --target SweetEngine_VST3 --parallel 2

      - name: Collect VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $bundle = Get-ChildItem -Path sweet-engine/build -Recurse -Directory -Filter "KG Sweet Engine.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "KG Sweet Engine.vst3 bundle not found" }
          Copy-Item -Recurse -Force $bundle.FullName artifact\
          Copy-Item sweet-engine\README.md artifact\README.txt
          Get-ChildItem -Recurse artifact

      - uses: actions/upload-artifact@v4
        with:
          name: KG-Sweet-Engine-v0.1-Windows-VST3
          path: artifact
          if-no-files-found: error
