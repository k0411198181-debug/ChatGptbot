name: Build KG Vocal Match VST3 Windows
on:
  push:
    branches: [ "kg-vocal-match-v0.3" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: cmake -S kg-vocal-match -B kg-vocal-match/build -G "Visual Studio 18 2026" -A x64
      - name: Build VST3
        shell: pwsh
        run: cmake --build kg-vocal-match/build --config Release --target KGVocalMatch_VST3 --parallel 2
      - name: Collect VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $bundle = Get-ChildItem -Path kg-vocal-match/build -Recurse -Directory -Filter "KG Vocal Match.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "KG Vocal Match.vst3 bundle not found" }
          Copy-Item -Recurse -Force $bundle.FullName artifact\
          Copy-Item kg-vocal-match\README.md artifact\README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KG-Vocal-Match-v0.3-Windows-VST3
          path: artifact
          if-no-files-found: error
