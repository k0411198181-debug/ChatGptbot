name: Build KG Sketch Piano VST3 Windows
on:
  push:
    branches: [ "kg-sketch-piano-v0.3" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: cmake -S kg-sketch-piano -B kg-sketch-piano/build -G "Visual Studio 18 2026" -A x64
      - name: Build VST3
        shell: pwsh
        run: cmake --build kg-sketch-piano/build --config Release --target KGSketchPiano_VST3 --parallel 2
      - name: Collect VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $bundle = Get-ChildItem -Path kg-sketch-piano/build -Recurse -Directory -Filter "KG Sketch Piano.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "KG Sketch Piano.vst3 bundle not found" }
          Copy-Item -Recurse -Force $bundle.FullName artifact\
          Copy-Item kg-sketch-piano\README.md artifact\README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KG-Sketch-Piano-v0.3-Windows-VST3
          path: artifact
          if-no-files-found: error
